let D=null, lang='es', ITEMIDX=null, PRODUCES=null, USES=null;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const u=()=>UI[lang];
const nm=id=>{const n=D.names[id]; return n?(lang==='es'?n[0]:n[1]):(id||'?').split(':').pop().replace(/_/g,' ')};
function icon(id,size){
  const k=D.pos[id]; const s=size||32;
  if(k===undefined){const t=(nm(id)||'?').replace(/[^A-Za-z0-9 ]/g,' ').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();return `<span class="ic miss" style="width:${s}px;height:${s}px">${esc(t)}</span>`}
  const sc=s/D.S, x=(k%D.cols)*s, y=Math.floor(k/D.cols)*s;
  return `<span class="ic" style="width:${s}px;height:${s}px;background-size:${D.cols*D.S*sc}px auto;background-position:-${x}px -${y}px" role="img" aria-label="${esc(nm(id))}"></span>`;
}
function slot(x){
  if(!x) return '<span class="slot empty"></span>';
  if(x.f) return `<span class="slot fluid empty" title="${esc(x.f)}${x.a?' · '+x.a+' mB':''}"></span>`;
  return `<button class="slot" data-item="${esc(x.i)}" title="${esc(nm(x.i))}${x.t?' (#)':''}">${icon(x.i)}${x.t?'<span class="tag">#</span>':''}${x.c?`<span class="cnt">${x.c}</span>`:''}${x.p?`<span class="tag">${Math.round(x.p*100)}%</span>`:''}</button>`;
}
function station(t){const s=D.stations[t]; return s?s[L()]:t.split(':').pop().replace(/[_\/]/g,' ')}
function L(){return lang==='es'?0:1}
function recipeGui(r){
  let left='';
  if(r.g){
    const rows=r.g.length, cols=Math.max(...r.g.map(x=>x.length));
    const cells=[]; const oR=rows<3?Math.floor((3-rows)/2):0, oC=cols<3?Math.floor((3-cols)/2):0;
    for(let i=0;i<3;i++)for(let j=0;j<3;j++){const rr=i-oR,cc=j-oC; cells.push(slot(r.g[rr]&&r.g[rr][cc]))}
    left=`<span class="slots" style="grid-template-columns:repeat(3,36px)">${cells.join('')}</span>`;
  } else if(r.center){
    const pos=[0,1,2,5,8,7,6,3]; const cells=Array(9).fill(null); cells[4]=r.center; (r.in||[]).slice(0,8).forEach((x,k)=>cells[pos[k]]=x);
    left=`<span class="slots" style="grid-template-columns:repeat(3,36px)">${cells.map(slot).join('')}</span>`;
  } else {
    const ins=(r.in||[]).filter(Boolean); const per=(r.k==='smithing'||r.k==='cook')?Math.max(ins.length,1):(ins.length>4?3:Math.max(ins.length,1));
    left=`<span class="slots" style="grid-template-columns:repeat(${per},36px)">${(ins.length?ins:[null]).map(slot).join('')}</span>`;
  }
  const outs=r.o.filter(Boolean);
  const right=`<span class="slots" style="grid-template-columns:repeat(${outs.length>1?2:1},36px)">${outs.map(slot).join('')}</span>`;
  return `<span class="gui">${left}<span class="arrow" aria-hidden="true"></span>${right}</span>`;
}
function ingText(r){
  const c=new Map(); const all=[...(r.g?r.g.flat():[]),...(r.center?[r.center]:[]),...(r.in||[])].filter(Boolean);
  for(const x of all){ const k=x.f?(x.f.split(':').pop().replace(/_/g,' ')+(x.a?` (${x.a} mB)`:'')):(nm(x.i)+(x.t?' *':'')); c.set(k,(c.get(k)||0)+(x.c||1)); }
  return [...c].map(([k,v])=>v>1?`${v}× ${k}`:k).join(', ');
}
function recipeCard(r){
  const o=r.o[0]; let meta=station(r.ty);
  if(r.st) meta+=` · ${u().steps}: `+r.st.map(s=>(D.steps[s]||[s,s])[L()]).join(' → ')+(r.lp?` (×${r.lp} ${u().loops})`:'');
  if(r.h) meta+=` · ${u().heat}: ${r.h}`;
  if(r.v) meta+=` · ${r.v} ${u().variants[r.vk]||''}`;
  const tip=D.tips[o.i]?D.tips[o.i][L()]:'';
  return `<article class="rcard">${recipeGui(r)}<div class="rname">${esc(nm(o.i))}${o.c?` ×${o.c}`:''}</div><div class="rmeta">${esc(meta)}</div><div class="rmeta">${esc(ingText(r))}</div>${tip?`<div class="rtip">${esc(tip)}</div>`:''}</article>`;
}
function catColor(c){return D.catcolor[c]||'#888'}
function buildIndexes(){
  ITEMIDX=[]; PRODUCES=new Map(); USES=new Map();
  const seen=new Set();
  for(const m of D.mods){
    for(const i of m.items){ if(!seen.has(i)){seen.add(i); ITEMIDX.push([i,m.key]);} }
    for(const r of m.recipes){
      const o=r.o[0]; if(o&&o.i){ if(!PRODUCES.has(o.i)) PRODUCES.set(o.i,[]); PRODUCES.get(o.i).push([r,m.key]); }
      const ins=[...(r.g?r.g.flat():[]),...(r.center?[r.center]:[]),...(r.in||[])].filter(x=>x&&x.i);
      for(const x of new Set(ins.map(x=>x.i))){ if(!USES.has(x)) USES.set(x,[]); USES.get(x).push([r,m.key]); }
    }
  }
  for(const id of Object.keys(D.names)) if(!seen.has(id)){seen.add(id); ITEMIDX.push([id,null]);}
}
function modOfItem(id){const ns=id.split(':')[0]; for(const m of D.mods){ if(m.items.length && m.items[0].split(':')[0]===ns) return m; } return null}
function rail(){
  const g=D.g[lang]; const cnt={};
  let h=`<div class="group"><a href="#home" data-r="home">${u().home}</a><a href="#compare" data-r="compare">${u().compare}</a></div>`;
  for(const c of D.catorder){
    const ms=D.mods.filter(m=>m.cat===c);
    h+=`<div class="group"><h4><span class="dot" style="background:${catColor(c)}"></span>${esc(g.cats[c])}</h4>`;
    for(const m of ms) h+=`<a href="#m-${m.key}" data-r="m-${m.key}">${esc(m.name)}${m.recipes.length?`<span class="n">${m.recipes.length}</span>`:''}</a>`;
    h+='</div>';
  }
  $('#rail').innerHTML=h; markRail();
}
function markRail(){const r=(location.hash||'#home').slice(1); document.querySelectorAll('#rail a').forEach(a=>a.setAttribute('aria-current',a.dataset.r===r?'page':'false'))}
function table(head,rows,numCols){

}

function sgChain(gt){const c=[];let g=gt;const P=D.sg.parent;while(g){c.push(g);g=P[g]||null;} if(!c.includes('all'))c.push('all');return c}
function sgPick(e,chain){if(!e)return null;for(const g of chain){if(e[g])return e[g];}return null}
function sgCompress(list){const out=[];for(const op of ['AVERAGE','MAX','ADD','MULTIPLY_BASE','MULTIPLY_TOTAL']){const l=list.filter(m=>m[1]===op);if(!l.length)continue;if(l.length===1){out.push(l[0]);continue}
  if(op==='MAX'){out.push([Math.max(...l.map(m=>m[0])),op]);continue}
  let p=l[0][0];p=p>0?p:1;let tw=0,s=0;for(const [v] of l){const w=1+v/(1+Math.abs(p));tw+=w;s+=v*w}out.push([tw>0?s/tw:s,op])}return out}
function sgVal(parts,gt,prop,lo,hi){const chain=sgChain(gt);const mp=(D.sg.mainParts[gt]||{}).p||{};let mods=[];
  for(const [pt,m] of parts){if(!m)continue;const l=[];const a=sgPick(((m.parts[pt]||{}).p||{})[prop],chain);if(a)l.push(a);if(pt==='main'){const b=sgPick(mp[prop],chain);if(b)l.push(b)}mods.push(...sgCompress(l))}
  if(!mods.length)return 0;
  const av=mods.filter(m=>m[1]==='AVERAGE');let f0=0;
  if(av.length){let p=av[0][0];p=p>0?p:1;let tw=0,s=0;for(const [v] of av){const w=1+v/(1+Math.abs(p));tw+=w;s+=v*w}f0+=tw>0?s/tw:s}
  for(const [v,o] of mods)if(o==='MAX')f0=Math.max(f0,v);
  let f1=f0;for(const [v,o] of mods)if(o==='MULTIPLY_BASE')f1+=f0*v;
  for(const [v,o] of mods)if(o==='MULTIPLY_TOTAL')f1*=1+v;
  for(const [v,o] of mods)if(o==='ADD')f1+=v;
  return Math.min(hi??1e9,Math.max(lo??0,f1))}
function sgTraits(parts,gt){const chain=sgChain(gt);const m=new Map();for(const [pt,mat] of parts){if(!mat)continue;for(const [id,lv,cond] of ((mat.parts[pt]||{}).t||[])){if(cond&&!chain.includes(cond))continue;m.set(id,Math.max(m.get(id)||0,lv))}}
  return [...m].map(([id,lv])=>`${(D.sg.traits[id]||{})[lang]||id} ${lv}`).join(', ')}
function sgTier(parts){let best=null;for(const [pt,m] of parts){if(!m)continue;const h=(m.parts[pt]||{}).h;if(h&&(!best||h[1]>best[1]))best=h}return best}
function sgByPart(pt){return D.sg.mats.filter(m=>m.parts[pt])}
function sgRowsFor(){const gt=SGS.gt;const isA=SGT.a.includes(gt);const M=id=>D.sg.mats.find(m=>m.id===id)||null;
  let mains=sgByPart('main').filter(m=>{const p=m.parts.main.p;const ch=sgChain(gt);return isA?((sgPick(p.armor_durability,ch)||[0])[0]>0):((sgPick(p.durability,ch)||[0])[0]>0)});
  if(SGS.main!=='*')mains=mains.filter(m=>m.id===SGS.main);
  let rods=isA?[null]:(SGS.rod==='*'?sgByPart('rod'):[M(SGS.rod)]);
  const extra=isA?[]:[['tip',M(SGS.tip)],['binding',M(SGS.binding)],['grip',M(SGS.grip)]];
  const rows=[];
  for(const mm of mains)for(const rd of rods){const parts=[['main',mm],['rod',rd],...extra,['coating',M(SGS.coating)]];
    const r={m:mm,rod:rd,tr:sgTraits(parts,gt)};
    if(isA){const md=D.sg.armorMult[gt]||1;r.arm=sgVal(parts,gt,'armor');r.tough=sgVal(parts,gt,'armor_toughness')/4;r.kb=sgVal(parts,gt,'knockback_resistance')/10;r.mag=sgVal(parts,gt,'magic_armor');r.dur=Math.round(md*Math.floor(sgVal(parts,gt,'armor_durability')));r.ench=sgVal(parts,gt,'enchantment_value')}

    rows.push(r)}

function sgSel(id,label,opts,val){return `<label class="sgf"><span>${label}</span><select id="${id}">${opts.map(([v,t])=>`<option value="${esc(v)}"${v===val?' selected':''}>${esc(t)}</option>`).join('')}</select></label>`}

  const n1=v=>f(Math.round(v*100)/100);

  else h+=table([x.sgHead,x.sgRod,x.dmg,x.spd,x.dps,x.dur,...(isT?[x.hspd,x.tier]:[]),x.ench2,x.sgTraits],shown.map(r=>[`<b>${dot(r.m)}</b>`,dot(r.rod),n1(r.dmg),n1(r.spd),n1(r.dps),f(r.dur),...(isT?[n1(r.hs),r.tier?esc(x.lvlN[Math.min(Math.floor(r.tier[1]),5)].split(' (')[0]+(r.tier[1]%1?'+':'')):'—']:[]),n1(r.ench),`<span class="muted">${esc(r.tr)}</span>`]),isT?[2,3,4,5,6,8]:[2,3,4,5,6]);

window.addEventListener('hashchange',()=>{$('#q').value=''; closeDrawer(); render(); window.scrollTo(0,0)});
let qt=null; $('#q').addEventListener('input',()=>{clearTimeout(qt); qt=setTimeout(render,180)});
function setLang(l){lang=l; try{localStorage.setItem('mpw-lang',l)}catch(e){} rail(); render(); closeDrawer();}
$('#lang-es').addEventListener('click',()=>setLang('es')); $('#lang-en').addEventListener('click',()=>setLang('en'));
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-copyip]');if(!b)return;const t=b.textContent;const ok=()=>{b.textContent=(lang==='es'?'¡Copiada!':'Copied!');setTimeout(()=>b.textContent=t,1500)};try{navigator.clipboard.writeText(b.dataset.copyip).then(ok,()=>{})}catch(_){}});
fetch('data.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{D=d; buildIndexes(); rail(); render();})
 .catch(err=>{$('#view').innerHTML=`<p>No se pudieron cargar los datos de la wiki (${esc(err.message)}). Recarga la página. / Could not load wiki data. Reload the page.</p>`});
})();
